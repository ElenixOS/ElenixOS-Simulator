name: Deploy WASM to Cloudflare R2

on:
  push:
    branches: [main]
    paths:
      - "CMakeLists.txt"
      - "main/**"
      - "fs/**"
      - "ElenixOS"
      - "ElenixOS/**"
      - "lvgl/**"
      - "lv_drivers/**"
      - "FreeRTOS/**"
      - ".github/workflows/deploy-wasm-pages.yml"
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Pin ElenixOS to latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          LATEST_TAG=$(gh api repos/ElenixOS/ElenixOS/releases --jq '.[0].tag_name')
          echo "Latest ElenixOS release: ${LATEST_TAG}"
          cd ElenixOS
          git fetch origin tag "${LATEST_TAG}" --no-tags
          git checkout "tags/${LATEST_TAG}"

      - name: Setup Emscripten SDK
        run: |
          set -euo pipefail
          git clone https://github.com/emscripten-core/emsdk.git --depth 1
          cd emsdk
          ./emsdk install 4.0.11
          ./emsdk activate 4.0.11
          source ./emsdk_env.sh
          echo "EMSDK=${EMSDK}" >> $GITHUB_ENV
          echo "${EMSDK}" >> $GITHUB_PATH
          echo "${EMSDK}/upstream/emscripten" >> $GITHUB_PATH

      - name: Prebuild Emscripten SDL2 cache
        run: |
          set -euo pipefail
          embuilder build sdl2

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Configure WASM build
        run: emcmake cmake -S . -B build-wasm -DEOS_PLATFORM=WASM -DCMAKE_BUILD_TYPE=Release

      - name: Build WASM artifacts
        run: cmake --build build-wasm --parallel 1

      - name: Prepare site
        run: |
          set -euo pipefail
          SHA="${GITHUB_SHA}"
          SHORT_SHA="${SHA::7}"
          SITE_DIR="_site"
          SRC_DIR="build-wasm/bin"

          mkdir -p "${SITE_DIR}/wasm/latest"
          mkdir -p "${SITE_DIR}/wasm/${SHORT_SHA}"

          cp -a "${SRC_DIR}/." "${SITE_DIR}/wasm/latest/"
          cp -a "${SRC_DIR}/." "${SITE_DIR}/wasm/${SHORT_SHA}/"

      - name: Install AWS CLI
        run: pip install awscli

      - name: Clean old versioned builds (keep last 10)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_REGION: auto
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          set -euo pipefail
          
          aws s3 ls s3://elenixos-wasm/wasm/ \
            --endpoint-url "$R2_ENDPOINT" \
            | awk '{print $2}' | sed 's|/||' | grep -v '^latest$' | sort > /tmp/versions.txt
          
          TOTAL=$(wc -l < /tmp/versions.txt)
          if [ "$TOTAL" -gt 10 ]; then
            echo "Found $TOTAL versioned builds, keeping last 10, deleting $((TOTAL - 10)) old ones..."
            head -n -10 /tmp/versions.txt | while read -r ver; do
              echo "Deleting: wasm/$ver"
              aws s3 rm "s3://elenixos-wasm/wasm/$ver/" --recursive \
                --endpoint-url "$R2_ENDPOINT"
            done
          else
            echo "Found $TOTAL versioned builds, no cleanup needed."
          fi

      - name: Sync to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_REGION: auto
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          set -euo pipefail
          aws s3 sync _site s3://elenixos-wasm \
            --endpoint-url "$R2_ENDPOINT" \
            --delete
          aws s3 cp _site s3://elenixos-wasm \
            --endpoint-url "$R2_ENDPOINT" \
            --recursive \
            --exclude '*' \
            --include '*.wasm' \
            --content-type 'application/wasm' \
            --metadata-directive REPLACE
          aws s3 cp _site s3://elenixos-wasm \
            --endpoint-url "$R2_ENDPOINT" \
            --recursive \
            --exclude '*' \
            --include '*.data' \
            --content-type 'application/octet-stream' \
            --metadata-directive REPLACE
